#######################################################################

#######################################################################
#                               Plugins                               #
#######################################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'njse22/kiss-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

#######################################################################
#                        GENERAL CONFIGURATION                        #
#######################################################################

# --- Copy and Paste --- # 
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

set -g mouse on
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s set-clipboard on

set -g base-index 1
set -g renumber-windows on

set -g base-index 1
set -g renumber-windows on
# set -g status-justify centre   

# --- Alarts ---#

# Enable all monitoring types globally
# set-window-option -g monitor-activity on
# set-window-option -g monitor-bell on  
# set-window-option -g monitor-silence 60

# Enable visual notifications
# set-option -g visual-activity on
# set-option -g visual-bell on

# Customize activity highlighting
# set-window-option -g window-status-activity-style bg=red,fg=white

# Add symbols to window names
# set-window-option -g window-status-format '#I:#W#{?window_activity_flag,!,}'

# --- Prefix (Ctrl + q) --- #
set-option -g prefix C-q
unbind-key C-q
bind-key C-q send-prefix
# Set the dalay between prefix and command 
set -s escape-time 1 

# --- Navigation vi-mode --- #
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# --- Panel Navigation (vim-tmux-navigator) --- # 
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j) || ($is_fzf && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || ($is_fzf && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"

# ---  Panels Redimention --- # 
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

# --- Split windows --- # 
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# --- Focus panel --- # 
bind -n M-z select-layout main-horizontal
bind -n M-Z select-layout even-horizontal

# --- Swap panel --- #
bind K swap-pane -U
bind J swap-pane -D

# --- Swap windows --- #
bind -n S-Down previous-window
bind -n S-Up next-window

bind O display-popup -d "#{pane_current_path}" \
    -x C -y C -w 80% -h 80% \
    -e "POPUP=true" -E "zsh"

# bind C-f display-popup -E -w 80% -h 80% "zsh -ci '__fzf_tmux_menu; echo -e \"\n[Presiona Enter para cerrar]\"; read'"

# bind-key C-f run-shell "zsh -c 'source ~/.zshrc; __fzf_tmux_menu'"

#######################################################################
#                         MENU CONFIGURATION                          #
#######################################################################

bind m \
display-menu -T " Menu " -x C -y C \
   -T " Menu " \
   "Paste "           p "paste-buffer -p"                                 \
   "Copy Mode"        c "copy-mode"                                       \
   ""\
   "Horizontal split" h "split-window -h"                                 \
   "Vertical split"   v "split-window -v"                                 \
   ""                 \
   "Close Panel"      x "kill-pane"                                       \
   "Rename Window"    r "command-prompt -I \"#W\" \"rename-window '%%'\"" \
   ""                 \
   "New Sesion"       n "new-session"                                     \
   "List Sesiones"    s "choose-tree -s"                                  \
   ""                 \
   "Reload Config"    R "source-file ~/.tmux.conf; display-message 'Reload Config'"


