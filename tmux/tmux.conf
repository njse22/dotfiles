# Defina custom theme -> KISS => Keep It Simple Stupid 
set -g @kiss-tmux_theme "tokyo"
set -g @kiss-tmux_transparent 0

set -g @kiss_window_status_style "slanted" # basic, rounded, slanted, power, blur

set -g @kiss-tmux_window_id_style "digital"
set -g @kiss-tmux_pane_id_style "hsquare"
set -g @kiss-tmux_zoom_id_style "dsquare"

set -g @kiss-tmux_show_datetime 0
set -g @kiss-tmux_date_format YMD
set -g @kiss-tmux_time_format 24H

set -g @kiss-pomodoro_status 1

# Set pomodoro status  sed 'y/0123456789/🯰🯱🯲🯳🯴🯵🯶🯷🯸🯹/'
set -g @pomodoro_interval_display " [%s/%s]"
set -g @pomodoro_granularity 'on'
set -g status-interval 1                       # Refresh the status line every second
 
set -g @pomodoro_mins 30                       # The duration of the Pomodoro
set -g @pomodoro_break_mins 5                  # The duration of the break after the Pomodoro completes
set -g @pomodoro_intervals 4                   # The number of intervals before a longer break is started
set -g @pomodoro_long_break_mins 10            # The duration of the long break
set -g @pomodoro_repeat 'off'                  # Automatically repeat the Pomodoros?
set -g @pomodoro_disable_breaks 'off'          # Turn off breaks

# --- Reload Config --- #
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

# --- Init TPM --- #
run '~/.tmux/plugins/tpm/tpm'
